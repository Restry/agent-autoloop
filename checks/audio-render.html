<!doctype html><meta charset="utf-8"><title>声音验证</title><pre id="results">正在离线渲染音频…</pre><script type="module">
import{TownAudio,normalizeSettings}from '../dist/town-audio.js';const results=[];const assert=(v,m)=>{if(!v)throw Error(m);};
async function render(theme,channel,muted=false){const context=new OfflineAudioContext(1,44100,44100),audio=new TownAudio({storage:null,contextFactory:()=>context});audio.update({theme,channels:{[channel]:{enabled:!muted,volume:.7}}});audio.init();if(channel==='ambient'){for(let i=0;i<10;i++)audio.tick(.1,{running:true,wind:.3});}else audio.preview(channel);const buffer=await context.startRendering(),samples=buffer.getChannelData(0);let sum=0,peak=0;for(const x of samples){sum+=x*x;peak=Math.max(peak,Math.abs(x));}return{rms:Math.sqrt(sum/samples.length),peak};}
try{assert(normalizeSettings(null).theme==='garden','invalid storage fallback');for(const theme of ['garden','mechanical','digital','soft'])for(const channel of ['start','end','ambient']){const on=await render(theme,channel),off=await render(theme,channel,true);assert(on.rms>.00001,theme+' '+channel+' is silent');assert(off.peak===0,theme+' '+channel+' mute failed');assert(on.peak<.95,'clipping');results.push({theme,channel,rms:on.rms,mutedPeak:off.peak});}
let stored='';const storage={getItem:()=>stored,setItem:(k,v)=>stored=v},a=new TownAudio({storage});a.update({channels:{start:{enabled:false,volume:.22}}});a.update({theme:'mechanical'});const b=new TownAudio({storage});assert(!b.settings.channels.start.enabled&&b.settings.channels.start.volume===.22,'theme/persistence changed channel');document.querySelector('#results').textContent='PASS\n'+JSON.stringify(results,null,2)+'\n设置持久化和主题切换通过';}catch(e){document.querySelector('#results').textContent='FAIL '+e.stack;}
</script>
